apiVersion: 1
groups:
  - orgId: 1
    name: soar-detection
    folder: SOAR
    interval: 1m
    rules:
      - uid: soar-ssh-bruteforce
        title: ssh-bruteforce
        condition: C
        noDataState: OK
        execErrState: Error
        labels:
          soar: 'true'
        annotations:
          summary: 'SSH brute force against tunnel instance'
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki-main
            model:
              datasource:
                type: loki
                uid: loki-main
              editorMode: code
              expr: 'sum by (ip) (count_over_time({job="tunnel-auth"} |~ "(?i)failed password" | pattern "<_> from <ip> port <_>" [3m]))'
              instant: true
              intervalMs: 1000
              legendFormat: '{{ip}}'
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [4]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: gt
                  type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        isPaused: false

      - uid: soar-pfsense-deny-flood
        title: pfsense-deny-flood
        condition: C
        noDataState: OK
        execErrState: Error
        labels:
          soar: 'true'
        annotations:
          summary: 'pfSense deny flood'
        data:
          - refId: A
            relativeTimeRange:
              from: 360
              to: 0
            datasourceUid: loki-main
            model:
              datasource:
                type: loki
                uid: loki-main
              editorMode: code
              expr: 'sum by (src) (count_over_time({job="pfsense"} |= "filterlog" |= ",block," | regexp "^(?:[^,]*,){18}(?P<src>[^,]*)" [5m]))'
              instant: true
              intervalMs: 1000
              legendFormat: '{{src}}'
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: gt
                  type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        isPaused: false

  - orgId: 1
    name: soar-health
    folder: SOAR
    interval: 1m
    rules:
      - uid: soar-dlq-notempty
        title: soar-dlq-notempty
        condition: C
        noDataState: OK
        execErrState: Error
        labels:
          soar: 'true'
        annotations:
          summary: 'SOAR DLQ has messages — replay required'
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-soar
            model:
              datasource:
                type: cloudwatch
                uid: cloudwatch-soar
              namespace: CS2/SOAR
              metricName: DlqDepth
              dimensions: {}
              region: eu-central-1
              statistic: Sum
              period: '60'
              queryType: timeSeriesQuery
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: gt
                  type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        isPaused: false