name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  TUNNEL_PSK: ${{ secrets.TUNNEL_PSK }}

jobs:
  validate:
    name: "1 · Validate"
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Terraform format check
        run: terraform fmt -check -recursive Terraform/ || echo "::warning::Formatting deviations found"
      - name: Terraform validate
        run: |
          cd Terraform
          terraform init -backend=false -input=false
          terraform validate

  security-scan:
    name: "2 · Security Scan"
    runs-on: [self-hosted, Linux, X64]
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - name: tfsec (static security analysis)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" aquasec/tfsec:latest /src/Terraform \
            --minimum-severity MEDIUM --no-color || \
            echo "::warning::tfsec findings - review the output above"

  plan:
    name: "3 · Plan"
    runs-on: [self-hosted, Linux, X64]
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416291743382:role/app-github-deployer
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform plan
        run: |
          cd Terraform
          cat > terraform.auto.tfvars <<EOF
          ssh_public_key = "${{ vars.SSH_PUBLIC_KEY }}"
          tunnel_eip_allocation_id = "${{ vars.TUNNEL_EIP_ALLOCATION_ID }}"
          tunnel_private_ip = "${{ vars.TUNNEL_PRIVATE_IP }}"
          monitoring_private_ip = "${{ vars.MONITORING_PRIVATE_IP }}"
          EOF
          terraform init -input=false
          terraform plan -var="discord_webhook_url=$DISCORD_WEBHOOK_URL" -input=false -var="tunnel_psk=$TUNNEL_PSK" -out=tfplan -detailed-exitcode && exit 0 \
            || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        with: { name: tfplan, path: Terraform/tfplan, retention-days: 7 }

  apply:
    name: "4 · Deploy (Apply)"
    runs-on: [self-hosted, Linux, X64]
    needs: [plan]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416291743382:role/app-github-deployer
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with: { name: tfplan, path: Terraform }
      - name: Terraform apply
        run: |
          cd Terraform
          terraform init -input=false
          terraform apply -var="discord_webhook_url=$DISCORD_WEBHOOK_URL" -auto-approve tfplan