name: destroy
on: workflow_dispatch    # ← button in the Actions UI
permissions:
  id-token: write
  contents: read
jobs:
  destroy:
    runs-on: [self-hosted, innovative-solution]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416291743382:role/app-github-deployer
          aws-region: eu-central-1
      - run: |
          cd /home/student/tf/echo-innovatech
          cat > /home/student/tf/echo-innovatech/terraform.auto.tfvars <<EOF
          ssh_public_key = "${{ vars.SSH_PUBLIC_KEY }}"
          EOF
          terraform init
          terraform destroy -auto-approve