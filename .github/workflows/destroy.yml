# destroy.yml — full replacement
name: destroy
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: eu-central-1
  TUNNEL_PSK: ${{ secrets.TUNNEL_PSK }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  destroy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416291743382:role/app-github-deployer
          aws-region: eu-central-1
      - name: Terraform destroy
        run: |
          cd Terraform
          cat > terraform.auto.tfvars <<EOF
          ssh_public_key = "${{ vars.SSH_PUBLIC_KEY }}"
          tunnel_eip_allocation_id = "${{ vars.TUNNEL_EIP_ALLOCATION_ID }}"
          tunnel_private_ip = "${{ vars.TUNNEL_PRIVATE_IP }}"
          monitoring_private_ip = "${{ vars.MONITORING_PRIVATE_IP }}"
          EOF
          terraform init -input=false
          terraform destroy -auto-approve -var="tunnel_psk=$TUNNEL_PSK" -var="discord_webhook_url=$DISCORD_WEBHOOK_URL"