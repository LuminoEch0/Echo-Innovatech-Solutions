
name: Weekly Linux Updates

on:
  # schedule:
  #   - cron: "0 3 * * 6"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-linux:
    name: Update persistent Linux servers
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pipx install ansible
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure SSH
        env:
          VPN_BASTION_HOST: ${{ vars.VPN_BASTION_HOST }}
        run: |
          set -e

          KEY="$HOME/.ssh/aws-lab"

          if [ -z "$VPN_BASTION_HOST" ]; then
            echo "VPN_BASTION_HOST GitHub variable is not configured."
            exit 1
          fi

          if [ ! -f "$KEY" ]; then
            echo "SSH private key not found: $KEY"
            exit 1
          fi

          chmod 600 "$KEY"
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

          # Remove previous entries for these aliases before writing them.
          sed -i '/^Host bastion$/,/^$/d' "$HOME/.ssh/config"
          sed -i '/^Host 10\.0\.30\.10 10\.0\.3\.10$/,/^$/d' "$HOME/.ssh/config"

          cat >> "$HOME/.ssh/config" <<EOF
          Host bastion
              HostName ${VPN_BASTION_HOST}
              User ec2-user
              IdentityFile ${KEY}
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              HostKeyAlias ${VPN_BASTION_HOST}

          Host 10.0.30.10 10.0.3.10
              User ec2-user
              IdentityFile ${KEY}
              IdentitiesOnly yes
              ProxyJump bastion
              StrictHostKeyChecking yes
          EOF

      - name: Check SSH connectivity
        run: |
          set -e

          echo "Testing bastion..."
          ssh bastion "hostname"

          echo "Testing monitoring server..."
          ssh 10.0.30.10 "hostname"

          echo "Testing IPsec tunnel..."
          ssh 10.0.3.10 "hostname"

      - name: Check Ansible connectivity
        run: |
          ansible aws_linux -m ping -i Terraform/ansible/inventory/aws.ini

      - name: Update Linux machines
        run: |
          ansible-playbook \
            -i Terraform/ansible/inventory/aws.ini \
            Terraform/ansible/playbooks/update-linux.yml
